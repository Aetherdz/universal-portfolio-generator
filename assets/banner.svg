<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="70%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="460" rx="20" fill="url(#bgGlow)"/>
  <rect width="1200" height="460" rx="20" fill="url(#accentGlow)"/>
  <rect width="1200" height="460" rx="20" fill="url(#cyanGlow)"/>
  <rect width="1200" height="460" rx="20" fill="url(#purpleGlow)"/>
  <rect width="1200" height="460" rx="20" fill="url(#grid)"/>

  <!-- Border Ring -->
  <rect x="1" y="1" width="1198" height="458" rx="19" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- Left Side: Hero Title & Badges -->
  <g transform="translate(60, 75)">
    <!-- Pill Badge -->
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="0.5">WORKBENCH V3.8</text>
    <text x="160" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">CLIENT-ONLY</text>

    <!-- Main Branding Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Portfolio<tspan fill="url(#primaryGrad)">Gen</tspan>
    </text>

    <!-- Subtitle Arabic / English -->
    <text x="2" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Cairo', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="0.2">
      ارسم هويتك · Draw Your Profile
    </text>

    <!-- Description -->
    <text x="2" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14.5" fill="#94a3b8" font-weight="400">
      The ultra-modern client-side portfolio generator for developers,
    </text>
    <text x="2" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14.5" fill="#94a3b8" font-weight="400">
      hackers, and security researchers. Zero build step, zero backend.
    </text>

    <!-- Feature Chips Row -->
    <g transform="translate(2, 215)">
      <!-- Chip 1 -->
      <rect width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🎨 7 Elite Themes</text>

      <!-- Chip 2 -->
      <g transform="translate(142, 0)">
        <rect width="124" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">⚡ Native RTL AR</text>
      </g>

      <!-- Chip 3 -->
      <g transform="translate(278, 0)">
        <rect width="136" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🚀 GitHub Pages</text>
      </g>
    </g>

    <!-- Secondary Chips Row -->
    <g transform="translate(2, 258)">
      <!-- Chip 4 -->
      <rect width="144" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">📦 Instant ZIP/HTML</text>

      <!-- Chip 5 -->
      <g transform="translate(156, 0)">
        <rect width="138" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">⌘K Quick Actions</text>
      </g>

      <!-- Chip 6 -->
      <g transform="translate(306, 0)">
        <rect width="112" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">💻 80+ Devicons</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Graphic UI Mockup Cards -->
  <g transform="translate(640, 50)" filter="url(#shadow)">
    <!-- Card 1: Bento Grid / Terminal Mockup -->
    <rect width="490" height="350" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>

    <!-- Window Control Bar -->
    <rect width="490" height="38" rx="16" fill="#161e2e" fill-opacity="0.9"/>
    <rect y="24" width="490" height="14" fill="#161e2e" fill-opacity="0.9"/>
    <circle cx="22" cy="19" r="5" fill="#ef4444"/>
    <circle cx="38" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="19" r="5" fill="#10b981"/>
    <text x="245" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">preview.portfoliogen.dev</text>

    <!-- Mini Bento Grid Inside Card -->
    <!-- Tile 1: Profile & Avatar -->
    <g transform="translate(20, 55)">
      <rect width="215" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-opacity="0.5" stroke-width="0.8"/>
      <!-- Avatar Circle with Initial -->
      <circle cx="45" cy="45" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="45" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle">A</text>
      <!-- Online Badge -->
      <circle cx="63" cy="61" r="5" fill="#10b981" stroke="#0f172a" stroke-width="1.5"/>
      <!-- Name & Role -->
      <text x="82" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Alex Morgan</text>
      <text x="82" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#38bdf8">AI Systems Lead</text>
      <text x="82" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">San Francisco, CA</text>
      <!-- Social Dots -->
      <circle cx="30" cy="92" r="7" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <circle cx="50" cy="92" r="7" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <circle cx="70" cy="92" r="7" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <rect x="86" y="86" width="115" height="12" rx="6" fill="#1e293b"/>
    </g>

    <!-- Tile 2: Metrics / Bounty -->
    <g transform="translate(250, 55)">
      <rect width="220" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">SECURITY REPUTATION</text>
      <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#34d399">#12 <tspan font-size="12" font-weight="500" fill="#64748b">Global</tspan></text>
      <rect x="16" y="78" width="188" height="6" rx="3" fill="#1e293b"/>
      <rect x="16" y="78" width="145" height="6" rx="3" fill="url(#neonCyan)"/>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" fill="#64748b">CVEs · HackerOne Top 1% · Triaged</text>
    </g>

    <!-- Tile 3: Skills Matrix -->
    <g transform="translate(20, 180)">
      <rect width="450" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">STACK &amp; TECHNOLOGIES</text>
      <!-- Skill Chips -->
      <g transform="translate(16, 36)">
        <rect width="66" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="33" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">TypeScript</text>
      </g>
      <g transform="translate(88, 36)">
        <rect width="52" height="24" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#60a5fa" text-anchor="middle">React</text>
      </g>
      <g transform="translate(146, 36)">
        <rect width="56" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(208, 36)">
        <rect width="50" height="24" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="25" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(264, 36)">
        <rect width="48" height="24" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#06b6d4" text-anchor="middle">Docker</text>
      </g>
      <g transform="translate(318, 36)">
        <rect width="40" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="20" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#a855f7" text-anchor="middle">Go</text>
      </g>
      <g transform="translate(364, 36)">
        <rect width="68" height="24" rx="6" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="34" y="16" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" fill="#ec4899" text-anchor="middle">Kubernetes</text>
      </g>
    </g>

    <!-- Tile 4: Project Card -->
    <g transform="translate(20, 270)">
      <rect width="450" height="65" rx="12" fill="#0f172a" stroke="#334155" stroke-opacity="0.5" stroke-width="0.8"/>
      <circle cx="34" cy="32" r="14" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <path d="M 30 32 L 33 35 L 39 29" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
      <text x="58" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Distributed Cloud Mesh Engine</text>
      <text x="58" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Zero-downtime microservices mesh built with Go, eBPF &amp; WebSockets</text>
      <rect x="360" y="21" width="74" height="22" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="397" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#60a5fa" text-anchor="middle">Live Demo ↗</text>
    </g>
  </g>
</svg>
