<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Universal Portfolio Studio — Next-Gen Developer Architecture</title>
  <meta name="description" content="Precision developer portfolio studio. 7 elevated themes, real-time device simulator, GitHub Pages sync, and instant zero-dependency export.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Elite Typography: Plus Jakarta Sans, Space Grotesk, JetBrains Mono, Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Icons: Devicon & Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Master Studio Stylesheet (Cache-Busted v2.6.0) -->
  <link rel="stylesheet" href="css/style.css?v=2.6.0">
</head>
<body class="dark">

  <!-- Toast Notification Hub -->
  <div id="toast-container"></div>

  <!-- Studio Top Navigation Bar -->
  <nav class="studio-nav">
    <div class="studio-nav-inner">
      <!-- Brand Identity -->
      <a href="./" class="brand-badge">
        <div class="brand-icon">
          <i class="fas fa-wand-magic-sparkles"></i>
        </div>
        <div>
          <div class="brand-text-title">Universal Portfolio Studio</div>
          <div class="brand-text-sub">v2.6 Precision Architecture · 7 Elevated Themes</div>
        </div>
      </a>

      <!-- Quick Nav Actions -->
      <div class="nav-actions">
        <!-- Quick Preview Toggle (Mobile Drawer) -->
        <button id="preview-toggle" class="btn btn-secondary btn-sm lg:hidden" title="Toggle Live Preview">
          <i class="fas fa-eye text-cyan-400"></i>
          <span>Preview</span>
        </button>

        <!-- Language Switcher -->
        <button id="lang-toggle" class="btn btn-secondary btn-sm" title="Switch Language">
          <i class="fas fa-globe text-blue-400 text-xs"></i>
          <span id="lang-label">عربي</span>
        </button>

        <!-- Theme Mode Toggle -->
        <button id="theme-toggle" class="btn btn-secondary btn-sm btn-icon" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
          <i class="fas fa-sun text-amber-400 text-xs"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Instant Persona Launchpad -->
  <div class="persona-strip">
    <span class="persona-strip-label">
      <i class="fas fa-bolt text-amber-400"></i>
      <span>Fast Presets:</span>
    </span>
    <button type="button" class="persona-btn" onclick="FormState.loadPersona('fullstack')">
      <span class="traffic-dot traffic-dot-green"></span>
      <span>💻 Full-Stack & Cloud</span>
    </button>
    <button type="button" class="persona-btn" onclick="FormState.loadPersona('cybersecurity')">
      <span class="traffic-dot traffic-dot-red"></span>
      <span>🛡️ Security & Bug Bounty</span>
    </button>
    <button type="button" class="persona-btn" onclick="FormState.loadPersona('creative')">
      <span class="traffic-dot traffic-dot-amber"></span>
      <span>🎨 Creative & Bento UI</span>
    </button>
    <button type="button" class="persona-btn" onclick="FormState.loadPersona('academic')">
      <span class="traffic-dot traffic-dot-green"></span>
      <span>🎓 AI Researcher & Academic</span>
    </button>
  </div>

  <!-- Main Split Studio Canvas -->
  <main class="studio-canvas">

    <!-- Left Column: The Blueprint Editor -->
    <div class="blueprint-card" id="form-panel">
      <!-- High-Craft Step Stepper -->
      <div class="blueprint-stepper" id="step-indicator">
        <button type="button" class="step-tab active" data-step="1">
          <i class="fas fa-user"></i>
          <span>1. Profile</span>
        </button>
        <button type="button" class="step-tab" data-step="2">
          <i class="fas fa-share-nodes"></i>
          <span>2. Socials</span>
        </button>
        <button type="button" class="step-tab" data-step="3">
          <i class="fas fa-code"></i>
          <span>3. Tech Stack</span>
        </button>
        <button type="button" class="step-tab" data-step="4">
          <i class="fas fa-folder-open"></i>
          <span>4. Projects</span>
        </button>
        <button type="button" class="step-tab" data-step="5">
          <i class="fas fa-palette"></i>
          <span>5. Theme</span>
        </button>
      </div>

      <!-- Step Content Area -->
      <div class="blueprint-content" id="form-container">
        <!-- Injected dynamically by js/form/ step modules -->
      </div>
    </div>

    <!-- Right Column: Live Interactive Device Frame Simulator -->
    <div class="simulator-card hidden lg:flex" id="preview-panel">
      <!-- Titlebar Mockup -->
      <div class="simulator-titlebar">
        <div class="mac-traffic-lights">
          <span class="traffic-dot traffic-dot-red"></span>
          <span class="traffic-dot traffic-dot-amber"></span>
          <span class="traffic-dot traffic-dot-green"></span>
        </div>

        <div class="mock-url-bar" id="simulator-url">
          <i class="fas fa-lock text-[10px] text-emerald-400"></i>
          <span>https://developer.studio/portfolio</span>
        </div>

        <div class="simulator-controls">
          <button type="button" class="sim-btn active" data-viewport="desktop" title="Desktop view">
            <i class="fas fa-desktop"></i>
          </button>
          <button type="button" class="sim-btn" data-viewport="tablet" title="Tablet view">
            <i class="fas fa-tablet-alt"></i>
          </button>
          <button type="button" class="sim-btn" data-viewport="mobile" title="Mobile view">
            <i class="fas fa-mobile-alt"></i>
          </button>
          <button type="button" id="preview-newtab" class="sim-btn text-blue-400" title="Open preview in new tab">
            <i class="fas fa-arrow-up-right-from-square"></i>
          </button>
          <button type="button" id="preview-close" class="sim-btn text-rose-400 lg:hidden" title="Close drawer">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>

      <!-- Live Preview Iframe Sandbox -->
      <div class="simulator-viewport desktop" id="preview-wrapper">
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin" srcdoc=""></iframe>
      </div>
    </div>
  </main>

  <!-- Mobile Sticky Bottom Action Bar -->
  <div class="mobile-action-bar sm:hidden" id="mobile-action-bar">
    <div style="display:flex;align-items:center;gap:0.5rem;max-width:480px;margin:0 auto">
      <button id="mobile-btn-prev" type="button" class="btn btn-secondary" style="flex:1;padding:0.75rem" onclick="prevStep()">
        <i class="fas fa-arrow-left text-xs"></i>
        <span>Back</span>
      </button>
      <button id="mobile-btn-preview" type="button" class="btn btn-secondary" style="padding:0.75rem 1rem" title="Live Preview">
        <i class="fas fa-eye text-blue-400"></i>
      </button>
      <button id="mobile-btn-next" type="button" class="btn btn-primary" style="flex:2;padding:0.75rem" onclick="nextStep()">
        <span id="mobile-next-text">Next</span>
        <i class="fas fa-arrow-right text-xs"></i>
      </button>
    </div>
  </div>

  <!-- Production Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- Modular Utilities & System Tokens -->
  <script src="js/i18n.js?v=2.6.0"></script>
  <script src="js/utils.js?v=2.6.0"></script>
  <script src="js/design-tokens.js?v=2.6.0"></script>

  <!-- Modular 7-Theme Architecture -->
  <script src="js/themes/registry.js?v=2.6.0"></script>
  <script src="js/themes/aether.js?v=2.6.0"></script>
  <script src="js/themes/terminal.js?v=2.6.0"></script>
  <script src="js/themes/minimal.js?v=2.6.0"></script>
  <script src="js/themes/bento.js?v=2.6.0"></script>
  <script src="js/themes/glassmorphic.js?v=2.6.0"></script>
  <script src="js/themes/dark-premium.js?v=2.6.0"></script>
  <script src="js/themes/academic.js?v=2.6.0"></script>
  <script src="js/themes.js?v=2.6.0"></script>

  <!-- Modular Form Steps Architecture -->
  <script src="js/form/state.js?v=2.6.0"></script>
  <script src="js/form/step1-profile.js?v=2.6.0"></script>
  <script src="js/form/step2-socials.js?v=2.6.0"></script>
  <script src="js/form/step3-skills.js?v=2.6.0"></script>
  <script src="js/form/step4-projects.js?v=2.6.0"></script>
  <script src="js/form/step5-theme.js?v=2.6.0"></script>
  <script src="js/form/actions.js?v=2.6.0"></script>
  <script src="js/form.js?v=2.6.0"></script>

  <!-- Preview Engine, GitHub Sync & Master Orchestrator -->
  <script src="js/preview.js?v=2.6.0"></script>
  <script src="js/github.js?v=2.6.0"></script>
  <script src="js/export.js?v=2.6.0"></script>
  <script src="js/app.js?v=2.6.0"></script>
</body>
</html>
